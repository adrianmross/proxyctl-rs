[package]
name = "proxyctl-rs"
version = "1.1.0"
edition = "2021"
authors = ["Adrian Ross"]
description = "A CLI tool for managing proxy configurations"
license = "MIT"
keywords = ["proxy", "vpn", "cli", "network"]
categories = ["command-line-utilities"]
repository = "https://github.com/adrianmross/proxyctl-rs"
homepage = "https://github.com/adrianmross/proxyctl-rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12.26", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
dirs = "6.0"
regex = "1.0"
config = "0.15.19"
toml = "0.9.8"
dotenvy = "0.15"
turso = "0.3.2"
colored = "3.0"

[profile.dist]
inherits = "release"
lto = "thin"

[workspace.metadata.dist]
dist-version = "0.31.0"
cargo-dist-version = "0.31.0"
ci = "github"
installers = ["shell", "homebrew"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
install-path = "CARGO_HOME"
install-updater = false
formula = "proxyctl"
pr-run-mode = "plan"
dispatch-releases = true
hosting = "github"

[dev-dependencies]
tempfile = "3.0"
